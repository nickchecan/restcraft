name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    name: Verify, package, and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Marketplace publishing access
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Missing VSCE_PAT repository secret. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          ./node_modules/.bin/vsce verify-pat nickchecan

      - name: Install virtual display support
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run the full test pipeline
        run: xvfb-run -a npm test

      - name: Build the production bundle
        run: npm run package

      - name: Run semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run release
