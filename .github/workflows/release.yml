name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    name: Verify, package, and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Let semantic-release authenticate Git pushes with the release App.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Marketplace publishing access
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Missing VSCE_PAT repository secret. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          ./node_modules/.bin/vsce verify-pat nickchecan

      - name: Install virtual display support
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run unit and integration suites
        run: xvfb-run -a npm test

      - name: Build the production bundle
        run: npm run package

      # Mint the short-lived token after verification so it does not expire
      # while dependencies are installed or tests run.
      - name: Create release App token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run semantic release
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run release
