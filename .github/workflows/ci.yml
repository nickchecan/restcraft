name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Validate commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate commit messages
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/commit.sh

  verify:
    name: Verify extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lint, formatting, and types
        run: npm run check

      - name: Install virtual display support
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run unit and integration suites
        run: xvfb-run -a npm test

      - name: Build the production bundle
        run: npm run package

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [commits, verify]
    if: ${{ always() }}
    steps:
      - name: Require all parallel jobs to succeed
        env:
          COMMITS_RESULT: ${{ needs.commits.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          for result in "$COMMITS_RESULT" "$VERIFY_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::All CI jobs must succeed (commits=$COMMITS_RESULT, verify=$VERIFY_RESULT)."
              exit 1
            fi
          done
