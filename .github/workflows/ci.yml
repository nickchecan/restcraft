name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install virtual display support
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run the full test pipeline
        run: xvfb-run -a npm test

      - name: Build the production bundle
        run: npm run package

      - name: Verify Marketplace publishing access
        if: github.event_name == 'push'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Missing VSCE_PAT repository secret. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          ./node_modules/.bin/vsce verify-pat nickchecan
