name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Validate commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate commit messages
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/commit.sh

  checks:
    name: Lint, format, and types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check lint, formatting, and types
        run: npm run check

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install virtual display support
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run the full test pipeline
        run: xvfb-run -a npm test

      - name: Build the production bundle
        run: npm run package

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [commits, checks, tests]
    if: ${{ always() }}
    steps:
      - name: Require all parallel jobs to succeed
        env:
          COMMITS_RESULT: ${{ needs.commits.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          for result in "$COMMITS_RESULT" "$CHECKS_RESULT" "$TESTS_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::All CI jobs must succeed (commits=$COMMITS_RESULT, checks=$CHECKS_RESULT, tests=$TESTS_RESULT)."
              exit 1
            fi
          done
